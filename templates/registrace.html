<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Registrace</title>
    <style>
        body { background-color: #222; color: white; text-align: center; font-family: Arial, sans-serif; }
        .formular { margin-top: 100px; background-color: #333; display: inline-block; padding: 40px; border-radius: 10px; }
        input { padding: 10px; margin: 10px; border-radius: 5px; width: 200px; border: none; }
        button { padding: 10px 20px; background-color: #ff9800; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #e68a00; }
        a { color: #4CAF50; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="formular">
        <h1>Zaregistruj se do Kina</h1>
        <form method="POST">
            <input type="text" name="jmeno" placeholder="Tvé jméno" required><br>
            <input type="password" name="heslo" placeholder="Tvé heslo" required><br>
            <button type="submit">Vytvořit účet</button>
        </form>
        <a href="/">← Zpět do sálu</a>
    </div>
</body>
</html>
