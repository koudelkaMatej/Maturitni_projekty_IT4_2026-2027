<!DOCTYPE html>
<html lang="cs">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <meta charset="UTF-8">
    <title>Registrace</title>

</head>
<body>
    <div class="formular">
        <h1>Zaregistruj se do Kina</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="jmeno" placeholder="Tvé jméno" required><br>
            <input type="password" name="heslo" placeholder="Tvé heslo" required><br>
            <button type="submit">Vytvořit účet</button>
        </form>
        <a href="/">← Zpět do sálu</a>
    </div>
</body>
</html>
