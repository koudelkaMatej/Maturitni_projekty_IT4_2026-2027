<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Přihlášení</title>
    <style>
        body { background-color: #222; color: white; text-align: center; font-family: Arial, sans-serif; }
        .formular { margin-top: 50px; background-color: #333; display: inline-block; padding: 40px; border-radius: 10px; }
        input { padding: 10px; margin: 10px; border-radius: 5px; width: 200px; border: none; }
        button { padding: 10px 20px; background-color: #4CAF50; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #45a049; }
        a { color: #ff9800; text-decoration: none; display: block; margin-top: 20px; }
        
        /* Styly pro hlášky */
        .flash { padding: 15px; margin: 10px auto; width: 300px; border-radius: 5px; font-weight: bold; }
        .flash.error { background-color: #f44336; color: white; border: 1px solid #d32f2f; }
        .flash.success { background-color: #4CAF50; color: white; border: 1px solid #388e3c; }
    </style>
</head>
<body>
    <div class="formular">
        <h1>Přihlášení do Kina</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="jmeno" placeholder="Tvé jméno" required><br>
            <input type="password" name="heslo" placeholder="Tvé heslo" required><br>
            <button type="submit">Přihlásit se</button>
        </form>
        <a href="/">← Zpět do sálu</a>
    </div>
</body>
</html>
