<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kino Maturita</title>
    <style>
        body {
            background-color: #222; /* Tmavé pozadí jako v kině */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .platno {
            background-color: white;
            color: black;
            padding: 10px;
            margin: 20px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 0 15px white; /* Efekt svícení */
            font-weight: bold;
            letter-spacing: 5px;
        }
        .sal {
            display: grid;
            grid-template-columns: repeat(5, 50px); /* 5 sedaček vedle sebe */
            gap: 10px;
            justify-content: center;
            margin-top: 50px;
        }
        .sedacka {
            width: 50px;
            height: 50px;
            background-color: #4CAF50; /* Zelená = volno */
            border-radius: 8px;
            cursor: pointer;
            /* Tyhle 3 řádky centrují číslo přesně doprostřed sedačky: */
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            text-decoration: none; /* Zruší podtržení, když ze sedačky uděláme odkaz */
        }
        .sedacka.obsazeno {
            background-color: #f44336; /* Červená = obsazeno */
            cursor: not-allowed;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Cinema Maturita</h1>
    <div class="platno">FILMOVÉ PLÁTNO</div>
    
    <div class="sal">
        <!-- Tady Python cyklem vygeneruje všechny sedačky -->
        {% for sedacka in sedacky %}
            {% if sedacka.obsazeno %}
                <div class="sedacka obsazeno">{{ sedacka.cislo }}</div>
            {% else %}
                <div class="sedacka">{{ sedacka.cislo }}</div>
            {% endif %}
        {% endfor %}
    </div>
</body>
</html>
