<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kino Maturita</title>
    <style>
        body {
            background-color: #222; /* Tmavé pozadí jako v kině */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .platno {
            background-color: white;
            color: black;
            padding: 10px;
            margin: 20px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 0 15px white; /* Efekt svícení */
            font-weight: bold;
            letter-spacing: 5px;
        }
        .sal {
            display: grid;
            grid-template-columns: repeat(5, 50px); /* 5 sedaček vedle sebe */
            gap: 10px;
            justify-content: center;
            margin-top: 50px;
        }
        .sedacka {
            width: 50px;
            height: 50px;
            background-color: #4CAF50; /* Zelená = volno */
            border-radius: 8px;
            cursor: pointer;
        }
        .sedacka.obsazeno {
            background-color: #f44336; /* Červená = obsazeno */
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Cinema Maturita</h1>
    <div class="platno">FILMOVÉ PLÁTNO</div>
    
    <div class="sal">
        <!-- Zatím si sedačky vyrobíme natvrdo "natupo" pro ukázku -->
        <div class="sedacka"></div>
        <div class="sedacka"></div>
        <div class="sedacka"></div>
        <div class="sedacka obsazeno"></div> <!-- Tahle bude červená -->
        <div class="sedacka"></div>
        <div class="sedacka"></div>
        <div class="sedacka"></div>
        <div class="sedacka obsazeno"></div>
        <div class="sedacka"></div>
        <div class="sedacka"></div>
    </div>
</body>
</html>
