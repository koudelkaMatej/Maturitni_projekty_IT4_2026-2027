<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kino Maturita</title>
    <style>
        body {
            background-color: #222; /* Tmavé pozadí jako v kině */
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .platno {
            background-color: white;
            color: black;
            padding: 10px;
            margin: 20px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 0 15px white; /* Efekt svícení */
            font-weight: bold;
            letter-spacing: 5px;
        }
        .sal {
            display: grid;
            grid-template-columns: repeat(5, 50px); /* 5 sedaček vedle sebe */
            gap: 10px;
            justify-content: center;
            margin-top: 50px;
        }
        .sedacka {
            width: 50px;
            height: 50px;
            background-color: #4CAF50; /* Zelená = volno */
            border-radius: 8px;
            cursor: pointer;
            /* Tyhle 3 řádky centrují číslo přesně doprostřed sedačky: */
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            text-decoration: none; /* Zruší podtržení, když ze sedačky uděláme odkaz */
        }
        .sedacka.obsazeno {
            background-color: #f44336; /* Červená = obsazeno */
            cursor: not-allowed;
            color: white;
        }
        .pokladna {
    margin-top: 40px;
    font-size: 24px;
    background-color: #333;
    display: inline-block;
    padding: 15px 30px;
    border-radius: 10px;
    border: 2px solid #ff9800; /* Oranžový rámeček */
    color: #ff9800;
}
    </style>
</head>
<body>
    <h1>Cinema Maturita</h1>
    <div class="platno">FILMOVÉ PLÁTNO</div>
    
    <div class="sal">
    {% for sedacka in sedacky %}
        {% if sedacka.obsazeno %}
            <!-- Změnili jsme div na odkaz (a) a přidali href -->
            <a href="/rezervace/{{ sedacka.cislo }}" class="sedacka obsazeno">{{ sedacka.cislo }}</a>
        {% else %}
            <a href="/rezervace/{{ sedacka.cislo }}" class="sedacka">{{ sedacka.cislo }}</a>
        {% endif %}
    {% endfor %}
</div>
<div class="pokladna">
    Celková cena rezervací: <strong>{{ celkova_cena }} Kč</strong>
</div>
</body>
</html>
