{% extends "base.html" %}
{% block obsah %}
    <h1>Cinema Maturita</h1>
    <div class="platno">FILMOVÉ PLÁTNO</div>
    
    <div class="sal">
        {% for sedacka in sedacky %}
            {% if sedacka.obsazeno %}
                <a href="/rezervace/{{ sedacka.cislo }}" class="sedacka obsazeno" title="Rezervoval: {{ sedacka.vlastnik if sedacka.vlastnik else 'Neznámý' }}">{{ sedacka.cislo }}</a>
            {% else %}
                <a href="/rezervace/{{ sedacka.cislo }}" class="sedacka" title="Volno">{{ sedacka.cislo }}</a>
            {% endif %}
        {% endfor %}
    </div>

    <div class="pokladna">
        Celková cena rezervací: <strong>{{ celkova_cena }} Kč</strong>
    </div>
{% endblock %}
