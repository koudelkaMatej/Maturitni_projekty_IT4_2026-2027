<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulka Skóre</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            color: #00e676;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            max-width: 400px;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        th, td {
            padding: 14px 20px;
            text-align: center;
        }
        th {
            background-color: #2c2c2c;
            color: #00e676;
            font-size: 16px;
        }
        tr:nth-child(even) {
            background-color: #252525;
        }
        tr:hover {
            background-color: #333333;
        }
        .empty {
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>🏆 Nejlepší Hráči</h1>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Hráč</th>
                <th>Skóre</th>
            </tr>
        </thead>
        <tbody>
            {% for row in scores %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="empty">Zatím nebylo odehráno žádné skóre.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
